name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Lets you run the jobs by hand from the Actions tab, without pushing a
  # commit, and download the rendered PNGs from the run page.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Set debuginfo to 0 (none) to minimize memory usage during linking
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check docs images are referenced
        # Guarantees every committed image in docs/src/images is used by the
        # book; generated-but-unreferenced output goes to target/ instead.
        run: |
          status=0
          for file in docs/src/images/*; do
            [ -e "$file" ] || continue
            base=$(basename "$file")
            if ! grep -rqs --include='*.md' -- "$base" .; then
              echo "error: docs image is not referenced by any Markdown file: $file" >&2
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "Reference the image from a .md file, or delete it and point its generator at target/ instead." >&2
            exit 1
          fi

      - name: Build Library
        # Adding --lib ensures we only build the core library first, 
        # avoiding the heavy linking of examples.
        run: cargo build --lib --verbose

      - name: Run tests
        # Adding --lib only runs unit tests inside src/. 
        # If you have a tests/ folder, use --tests instead of --examples.
        run: cargo test --lib --tests --verbose

      - name: Lint with Clippy
        # Again, focus only on the library and tests to save memory
        run: cargo clippy --lib --tests -- -D warnings

  # The raster (PNG) backend is only compiled behind `--features png`, so it is
  # invisible to the default-feature job above. Text rendering is inherently
  # platform dependent, which is why this runs on all three OSes. `macos-15` is
  # an Apple-silicon runner and ships the exact fonts from the font issue
  # (PingFang SC, Hiragino Sans GB, Helvetica), so the macOS run is the faithful
  # reproduction.
  raster_font_tests:
    name: Raster fonts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: raster-fonts

      - name: Install CJK and Latin fonts (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core

      - name: Font resolution and raster text tests
        # `--nocapture` so the skip reasons are visible when a host does not
        # ship the fonts a case needs.
        run: cargo test --features png --lib -- --nocapture

      - name: Render the issue's cases
        # Runs even when a test failed, so the artifact shows what was drawn.
        if: always()
        run: cargo run --features png --example chinese

      - name: Upload rendered PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raster-fonts-${{ matrix.os }}
          path: |
            target/test-output/font-issue/*.png
            target/example-output/font-issue/*.png
          if-no-files-found: ignore
