[package]
name = "charton"
version = "0.6.3"
edition = "2024"
description = "A high-performance, layered charting system for Rust, featuring a flexible data core and multi-backend rendering."
license = "Apache-2.0"
repository = "https://github.com/wangjiawen2013/charton"
authors = ["Jiawen Wang <wangjiawen2013@163.com>"]

# Exclude heavy files when uploading to crates.io
exclude = [
    "assets/wasm.gif"
]

[features]
# Default features enabled for standard desktop builds.
default = []

# Enables multi-threaded data processing via Rayon for massive datasets.
# NOTE: Disable this feature when targeting WebAssembly (Wasm) unless
# using a specialized thread-pool adapter like wasm-bindgen-rayon.
parallel = ["dep:rayon"]

# Enables exporting charts to PDF.
pdf = ["dep:krilla", "dep:ab_glyph", "dep:fontdb"]

# Enables high-performance raster rendering (PNG, etc.)
raster = ["dep:tiny-skia", "dep:ab_glyph", "dep:fontdb"]
png = ["raster"] # png is an alias of raster

# Enables lightweight GPU-accelerated rendering for large datasets via wgpu.
wgpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]

# Enable support for geographic data parsing (GeoJSON)
geo = ["dep:geojson", "dep:serde_json"]

# Enables universal columnar data ingestion via the Apache Arrow standard.
arrow = ["dep:arrow-array", "dep:arrow-schema", "dep:arrow-select"]

[dependencies]
# --- Core Dependencies ---
thiserror = "2.0"
time = { version = "0.3", features = ["macros", "formatting"] }
ahash = "0.8"
csscolorparser = { version = "0.8", default-features = false, features = ["std"] }

# --- Optional Dependencies ---
rayon = { version = "1.11", optional = true }
krilla = { version = "0.8", optional = true, default-features = false }
tiny-skia = { version = "0.12", optional = true }
ab_glyph = { version = "0.2", optional = true }
fontdb = { version = "0.23", optional = true }
arrow-array = { version = "58.1", default-features = false, optional = true }
arrow-schema = { version = "58.1", default-features = false, optional = true }
arrow-select = { version = "58.1", default-features = false, optional = true }
geojson = { version = "1.0.0", optional = true }
serde_json = { version = "1.0", optional = true }
wgpu = { version = "29", optional = true }
bytemuck = { version = "1.25", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }

# --- WASM32 Target Specific Dependencies ---
# Leveraged only when targeting WebAssembly; provides full access to browser DOM and Canvas APIs without impacting desktop builds.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["CssStyleDeclaration", "HtmlCanvasElement", "CanvasRenderingContext2d"] }
