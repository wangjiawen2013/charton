[package]
name = "nu_plugin_charton"
version = "0.9.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/wangjiawen2013/charton"
homepage = "https://wangjiawen2013.github.io/charton"
documentation = "https://wangjiawen2013.github.io/charton/ecosystem/nushell.html"
description = "Nushell plugin for charton: turn pipeline tables into charts"
readme = "README.md"
keywords = ["nushell", "charts", "plotting", "cli", "visualization"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
# Path + version so the crate stays publishable; the version is the floor this
# plugin's rendering relies on, and the features give it PNG output plus GeoJSON.
charton = { path = "..", version = "0.9.1", features = ["png", "geo"] }
# The plugin protocol is versioned with Nushell and the engine rejects a
# plugin built against a different minor, so both crates are pinned to the
# release line this plugin targets.
nu-plugin = "=0.117"
nu-protocol = "=0.117"
# Decode charton's PNG output for truecolor half-block terminal rendering.
png = "0.18"
# Base64 payloads for the iTerm2 / Kitty inline image protocols.
base64 = "0.22"
# Read the interactive terminal dimensions for auto-fitting inline charts.
terminal_size = "0.4"
# DEC Sixel encoder for terminals whose image protocol is sixel.
icy_sixel = "0.7.0"

[features]
# Development-only diagnostic command (`charton-probe`). Off by default so it
# does not appear in users' `help commands`.
probe = []

[dev-dependencies]
nu-plugin-test-support = "=0.117"
