[package]
name = "charton-cli"
version = "0.9.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/wangjiawen2013/charton"
homepage = "https://wangjiawen2013.github.io/charton"
description = "Command-line interface for charton: a CSV to a chart in one command"
readme = "README.md"
keywords = ["charts", "plotting", "cli", "visualization", "csv"]
categories = ["command-line-utilities", "visualization"]

[[bin]]
name = "charton"
path = "src/main.rs"

[dependencies]
# `spec` turns the JSON dialect on; PNG and PDF make `-o report.pdf` work.
# The CLI is a separate crate so these never reach a library user's build.
charton = { path = "..", version = "0.9.1", features = ["spec", "png", "pdf"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
csv = "1"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# Integration tests drive the real binary through CARGO_BIN_EXE_charton; no
# extra harness is needed.
